<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=block" rel="stylesheet">
<style>
:root{--bg:#F3F6F8;--panel:#FFFFFF;--text:#182C36;--muted:#435965;--accent:#086B68;--tint:#E4F3F0;--line:#DCE4E8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:'IBM Plex Sans',sans-serif;color:var(--text);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0}
.bgrid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:120px 120px;opacity:.35;mask-image:radial-gradient(ellipse at 70% 50%,#000 0%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 70% 50%,#000 0%,transparent 70%)}
.mark{position:absolute;left:120px;top:72px;display:flex;align-items:center;gap:14px;font-weight:600;font-size:26px;color:var(--text);letter-spacing:-.01em}
.mark svg{width:34px;height:34px}
.scene{position:absolute;inset:0;opacity:0}
.hl{position:absolute;font-weight:600;font-size:76px;line-height:1.06;letter-spacing:-.025em;color:var(--text)}
.hl b{font-weight:600;color:var(--accent)}
.sub{position:absolute;font-weight:500;font-size:34px;line-height:1.3;color:var(--muted);letter-spacing:-.01em}
.card{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 2px 4px rgba(24,44,54,.05),0 30px 70px -20px rgba(24,44,54,.28)}
.crop{position:relative;overflow:hidden;border-radius:10px;background-repeat:no-repeat}
.wash{position:absolute;inset:0;background:rgba(243,246,248,.0);pointer-events:none}
.spot{position:absolute;border-radius:8px;border:3px solid #3FC2B8;box-shadow:0 0 0 9999px rgba(243,246,248,.58),0 0 0 7px rgba(8,107,104,.35);opacity:0}
.cap{position:absolute;left:120px;bottom:72px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:14px 24px 14px 20px;font-size:26px;font-weight:500;color:var(--muted);box-shadow:0 10px 30px -14px rgba(24,44,54,.25);white-space:nowrap}
.logo{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:28px}
.logo .name{font-weight:600;font-size:132px;letter-spacing:-.035em}
.logo svg{width:116px;height:116px}
.center{position:absolute;left:0;right:0;text-align:center}
.pill{display:inline-flex;align-items:center;gap:12px;background:var(--tint);color:var(--accent);border-radius:999px;padding:12px 26px;font-weight:600;font-size:28px}
.honest{font-family:'IBM Plex Mono',monospace;font-size:22px;color:var(--muted);letter-spacing:.02em}
.sub2{font-weight:600;color:var(--accent)}
</style></head>
<body><div id="stage"></div>
<script>
const FUNNEL='<svg viewBox="0 0 40 40" fill="none"><rect x="1.5" y="1.5" width="37" height="37" rx="9" stroke="currentColor" stroke-width="3"/><path d="M10 12h20l-7.5 9v8l-5 2.5V21z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg>';
// cubic-bezier(.2,.7,.2,1)
function bez(p1x,p1y,p2x,p2y){const cx=3*p1x,bx=3*(p2x-p1x)-cx,ax=1-cx-bx,cy=3*p1y,by=3*(p2y-p1y)-cy,ay=1-cy-by;
 const sx=t=>((ax*t+bx)*t+cx)*t, sy=t=>((ay*t+by)*t+cy)*t, dx=t=>(3*ax*t+2*bx)*t+cx;
 return x=>{if(x<=0)return 0;if(x>=1)return 1;let t=x;for(let i=0;i<8;i++){const e=sx(t)-x;if(Math.abs(e)<1e-6)break;const d=dx(t);if(Math.abs(d)<1e-6)break;t-=e/d}return sy(Math.min(1,Math.max(0,t)))}}
const ease=bez(.2,.7,.2,1), easeIn=bez(.4,0,1,1);
const clamp=v=>Math.max(0,Math.min(1,v));
const prog=(t,at,dur)=>at<=0&&t>=0&&dur===0?1:ease(clamp((t-at)/dur));
let TL=null, SEC=null, SC=[];
function el(tag,cls,html,parent){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;(parent||document.getElementById('stage')).appendChild(e);return e}
window.setup=function(tl,section){
 TL=tl;SEC=tl[section];const st=document.getElementById('stage');st.innerHTML='';
 el('div','bgrid');
 const [FW,FH]=tl.frame_size;
 SEC.scenes.forEach(s=>{
  const root=el('div','scene');const o={s,root,parts:[]};
  if(s.layout!=='logo'&&s.layout!=='outro'){const m=el('div','mark',FUNNEL+'<span>Creator Scout</span>',root);m.style.color='var(--text)';m.querySelector('svg').style.color='var(--accent)'}
  if(s.layout==='side'||s.layout==='stack'){
   const c=s.crop,cw=Math.round(c.w*c.scale),ch=Math.round(c.h*c.scale);
   const hl=el('div','hl',s.headline,root);
   let card;
   if(s.layout==='side'){hl.style.left='120px';hl.style.width='660px';
     card=el('div','card',null,root);const cx=1800-cw-28;card.style.left=cx+'px';card.style.top=Math.round(520-(ch+28)/2)+'px';
     o.hlY=()=>{};
     // vertically center headline (+sub) against the card
     hl.style.top='0px';
   } else {hl.style.left='120px';hl.style.top='190px';hl.style.width='1680px';
     card=el('div','card',null,root);card.style.left='120px';card.style.top='330px';}
   const cr=el('div','crop',null,card);cr.style.width=cw+'px';cr.style.height=ch+'px';
   cr.style.backgroundImage=`url("file://${tl.footage_dir}/${c.frame}")`;
   cr.style.backgroundSize=`${FW*c.scale}px ${FH*c.scale}px`;
   cr.style.backgroundPosition=`${-c.x*c.scale}px ${-c.y*c.scale}px`;
   o.hl=hl;o.card=card;o.crop=cr;o.cw=cw;o.ch=ch;
   if(s.sub){o.sub=el('div','sub',s.sub,root);o.sub.style.left='120px';o.sub.style.width='640px'}
   o.spots=(s.spots||[]).map(p=>{const d=el('div','spot',null,cr);d.style.left=(p.x*c.scale)+'px';d.style.top=(p.y*c.scale)+'px';d.style.width=(p.w*c.scale)+'px';d.style.height=(p.h*c.scale)+'px';return {p,d}});
   if(s.caption){o.cap=el('div','cap',s.caption,root)}
  }
  if(s.layout==='logo'){
   o.logo=el('div','logo',FUNNEL+'<span class="name">Creator Scout</span>',root);o.logo.style.top='330px';o.logo.querySelector('svg').style.color='var(--accent)';
   o.sub=el('div','center sub',s.sub,root);o.sub.style.top='540px';o.sub.style.fontSize='44px';
   o.foot=el('div','center','<span class="pill">'+s.foot+'</span>',root);o.foot.style.top='680px';
  }
  if(s.layout==='outro'){
   o.logo=el('div','logo',FUNNEL+'<span class="name">Creator Scout</span>',root);o.logo.style.top='250px';o.logo.querySelector('svg').style.color='var(--accent)';
   o.sub=el('div','center sub',s.sub,root);o.sub.style.top='455px';o.sub.style.fontSize='46px';
   o.sub2=el('div','center sub sub2',s.sub2,root);o.sub2.style.top='522px';o.sub2.style.fontSize='46px';
   o.foot=el('div','center','<span class="pill">'+s.foot+'</span>',root);o.foot.style.top='680px';
   o.hon=el('div','center honest',s.honesty,root);o.hon.style.top='930px';
  }
  SC.push(o);
 });
 // vertical centering for side layout after fonts load
 SC.forEach(o=>{if(o.s.layout==='side'){const h1=o.hl.offsetHeight,h2=o.sub?o.sub.offsetHeight+28:0;const top=Math.round(520-(h1+h2)/2);o.hl.style.top=top+'px';if(o.sub)o.sub.style.top=(top+h1+28)+'px'}});
 return SC.length;
};
function inOut(node,t,at,end,dy){ // t local; fade/slide in at 'at', out over the last 0.28s of the scene
 const pi=at<=0?1:ease(clamp((t-at)/0.5));
 const po=easeIn(clamp((t-(end-0.28))/0.28));
 node.style.opacity=(pi*(1-po)).toFixed(4);
 node.style.transform=`translateY(${((1-pi)*(dy||26)-po*14).toFixed(2)}px)`;
}
window.render=function(T){
 SC.forEach(o=>{const s=o.s;const on=T>=s.start&&T<s.end+1e-6;o.root.style.opacity=on?1:0;if(!on)return;
  const t=T-s.start,end=s.end-s.start;const last=(s.end>=SEC.duration-1e-6);
  const E=last?end+10:end; // final scene never fades out (clean last frame)
  if(o.hl)inOut(o.hl,t,s.headline_at,E);
  if(o.sub)inOut(o.sub,t,s.sub_at,E,18);
  if(o.cap)inOut(o.cap,t,s.caption_at,E,14);
  if(o.card){const c=s.crop;const pi=ease(clamp((t-c.at)/0.6)),po=easeIn(clamp((t-(E-0.28))/0.28));
    o.card.style.opacity=(pi*(1-po)).toFixed(4);
    const dx=s.layout==='side'?(1-pi)*60:0,dy=s.layout==='stack'?(1-pi)*40:0;
    o.card.style.transform=`translate(${dx.toFixed(2)}px,${(dy-po*14).toFixed(2)}px) scale(${(0.985+0.015*pi).toFixed(4)})`;
    if(c.reveal){let h=0;c.reveal.forEach((r,i)=>{const prev=i?c.reveal[i-1].h:0;const p=ease(clamp((t-r.at)/0.45));if(t>=r.at)h=prev+(r.h-prev)*p});
      o.crop.style.height=Math.max(1,h*c.scale).toFixed(1)+'px'}
    // spotlights: each holds until the next one starts
    o.spots.forEach((sp,i)=>{const nx=o.spots[i+1];const pi2=ease(clamp((t-sp.p.at)/0.4));const po2=nx?ease(clamp((t-nx.p.at)/0.3)):0;
      sp.d.style.opacity=(pi2*(1-po2)).toFixed(4);sp.d.style.transform=`scale(${(1.04-0.04*pi2).toFixed(4)})`});
  }
  if(o.logo){const pi=ease(clamp((t-s.headline_at)/0.6));o.logo.style.opacity=pi.toFixed(4);o.logo.style.transform=`translateY(${((1-pi)*24).toFixed(2)}px) scale(${(0.97+0.03*pi).toFixed(4)})`}
  if(o.sub2)inOut(o.sub2,t,s.sub2_at,E,18);
  if(o.foot)inOut(o.foot,t,s.foot_at,E,14);
  if(o.hon)inOut(o.hon,t,s.honesty_at,E,10);
 });
};
</script></body></html>
